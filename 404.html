<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <script>
      (function () {
        const basePath = "/documentation/researchkit";

        const currentPath = window.location.pathname;

        // If the path doesn't start with the base path, redirect
        if (!currentPath.startsWith(basePath)) {
          // Redirect to the base path (keeping query and hash if present)
          const newUrl = basePath + window.location.search + window.location.hash;
          window.location.replace(newUrl);
        }
      })();
  </script>
</head>
<body>
  <p>If you are not redirected automatically, <a href="/documentation/project">click here</a>.</p>
</body>
</html>
